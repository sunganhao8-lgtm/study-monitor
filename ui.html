<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Study Monitor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
const API_BASE = "";
async function api(path, opts={}) {
  const r = await fetch(API_BASE + path, {
    headers: {"Content-Type": "application/json"},
    ...opts,
  });
  return r.json();
}
function $(id) { return document.getElementById(id); }
</script>
<style>
:root {
  --bg: #0b0c0e;
  --bg-card: #141517;
  --bg-surface: #1c1d21;
  --border: #2a2b30;
  --border-hover: #3a3b42;
  --text: #e8e9ec;
  --text-2: #9a9ca8;
  --text-3: #63656e;
  --accent: #f05a5a;
  --accent-2: #ff8540;
  --green: #2ac76a;
  --blue: #4a8ef5;
  --yellow: #e0a800;
  --purple: #a855f7;
  --radius: 10px;
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  --mono: "SF Mono", Menlo, Consolas, monospace;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  min-height: 100vh;
}

/* ─── Nav ─── */
.nav {
  display: flex;
  align-items: center;
  gap: 0;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  padding: 0 20px;
  position: sticky;
  top: 0;
  z-index: 100;
  height: 52px;
}
.nav-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 17px;
  margin-right: 32px;
}
.nav-logo-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 10px var(--accent);
}
.nav-tabs { display: flex; gap: 0; flex:1; }
.nav-tab {
  padding: 0 18px;
  height: 52px;
  display: flex;
  align-items: center;
  cursor: pointer;
  color: var(--text-2);
  font-size: 14px;
  font-weight: 500;
  border-bottom: 2px solid transparent;
  transition: all 0.15s;
}
.nav-tab:hover { color: var(--text); }
.nav-tab.active {
  color: var(--text);
  border-bottom-color: var(--accent);
}
.nav-status {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 12px;
  color: var(--text-3);
  margin-left: auto;
}
.dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--text-3);
  display: inline-block;
  margin-right: 4px;
}
.dot.on { background: var(--green); box-shadow: 0 0 6px var(--green); }
.dot.off { background: var(--accent); box-shadow: 0 0 6px var(--accent); }

/* ─── Layout ─── */
.container { max-width: 1320px; margin: 0 auto; padding: 24px; }

.tab-content { display: none; }
.tab-content.active { display: block; }

/* ─── Cards ─── */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 20px;
}
.card-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-2);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-title .badge {
  font-size: 11px;
  padding: 1px 8px;
  background: var(--bg-surface);
  border-radius: 8px;
  color: var(--text-3);
  font-weight: 400;
}

/* ─── Dashboard Grid ─── */
.dash-grid { display: grid; grid-template-columns: 1fr 340px; gap: 20px; }
@media(max-width:980px){ .dash-grid { grid-template-columns:1fr; } }

.state-card {
  display: flex;
  gap: 24px;
  align-items: stretch;
}
.state-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: var(--bg-surface);
  border-radius: var(--radius);
  padding: 32px 20px;
  position: relative;
  overflow: hidden;
  min-height: 200px;
}
.state-emoji { font-size: 56px; line-height: 1; }
.state-label { font-size: 26px; font-weight: 700; margin: 8px 0 4px; }
.state-meta { font-size: 13px; color: var(--text-3); }
.state-conf {
  display: inline-block;
  margin-top: 8px;
  padding: 2px 12px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 500;
  background: rgba(42,199,106,0.12);
  color: var(--green);
}
.state-viz {
  width: 180px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.eye-svg-wrap {
  background: var(--bg-surface);
  border-radius: var(--radius);
  padding: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 1;
}
.metrics-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.metric-item {
  background: var(--bg-surface);
  border-radius: 8px;
  padding: 10px 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.metric-label { font-size: 11px; color: var(--text-3); }
.metric-val { font-family: var(--mono); font-size: 13px; font-weight: 600; }
.metric-val.danger { color: var(--accent); }
.metric-val.warn { color: var(--yellow); }
.metric-val.ok { color: var(--green); }

/* Live Feed */
.feed-wrap { position: relative; }
.feed-controls {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
.feed-img {
  width: 100%;
  aspect-ratio: 16/9;
  background: var(--bg-surface);
  border-radius: 8px;
  object-fit: cover;
  display: block;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 7px 14px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg-surface);
  color: var(--text-2);
  font-size: 13px;
  font-family: inherit;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.12s;
}
.btn:hover {
  background: var(--border);
  color: var(--text);
}
.btn.primary {
  background: var(--green);
  color: #000;
  border-color: var(--green);
}
.btn.primary:hover { background: #22b85a; }
.btn.danger {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.btn.danger:hover { background: #e04444; }
.btn.ghost { border-color: transparent; background: transparent; }

/* ├── Alerts ── */
.alerts-toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.hint { font-size: 12px; color: var(--text-3); }
.alerts-list { display: flex; flex-direction: column; gap: 8px; }
.alert-item {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
  border-left: 3px solid var(--border);
}
.alert-item.pending { border-left-color: var(--accent-2); }
.alert-item.confirmed { border-left-color: var(--green); opacity: 0.6; }
.alert-item.dismissed { border-left-color: var(--text-3); opacity: 0.4; }
.alert-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.alert-type { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 6px; }
.alert-time { color: var(--text-3); font-size: 11px; font-family: var(--mono); }
.alert-msg { color: var(--text); margin-bottom: 8px; padding: 6px 10px; background: var(--bg); border-radius: 6px; font-size: 13px; }
.alert-detail { display: grid; grid-template-columns: repeat(auto-fill, minmax(105px,1fr)); gap: 6px; margin-bottom: 8px; }
.alert-det { background: var(--bg); padding: 5px 8px; border-radius: 4px; }
.alert-det .lbl { font-size: 10px; color: var(--text-3); }
.alert-det .val { font-family: var(--mono); font-size: 12px; font-weight: 600; }
.alert-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.alert-btn {
  padding: 5px 12px;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
  border: none;
  font-family: inherit;
  font-weight: 500;
}
.alert-btn.confirm { background: var(--green); color: #000; }
.alert-btn.dismiss { background: var(--bg); color: var(--text-2); border:1px solid var(--border); }
.alert-actions .alert-btn { margin-right: 0; }

/* ├── Stats ── */
.stats-bar { display: flex; flex-direction: column; gap: 5px; margin-bottom: 16px; }
.stat-row { display: grid; grid-template-columns: 85px 1fr 70px; align-items: center; gap: 10px; font-size: 12px; }
.stat-label { display: flex; align-items: center; gap: 5px; color: var(--text-2); }
.stat-track { height: 6px; background: var(--bg-surface); border-radius: 3px; overflow: hidden; }
.stat-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
.stat-time { font-family: var(--mono); font-size: 11px; color: var(--text-2); text-align: right; }
.stat-count-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px,1fr)); gap: 6px; }
.stat-count-item { background: var(--bg-surface); border-radius: 6px; padding: 8px 10px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
.stat-count-label { display: flex; align-items: center; gap: 5px; color: var(--text-2); }
.stat-count-num { font-family: var(--mono); font-weight: 600; }
.stat-big { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 20px; }
.stat-big-item { background: var(--bg-surface); border-radius: 8px; padding: 14px; text-align: center; }
.stat-big-item .val { font-size: 22px; font-weight: 700; }
.stat-big-item .lbl { font-size: 11px; color: var(--text-3); margin-top: 2px; }

/* ├── Config ── */
.cfg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media(max-width:800px){ .cfg-grid { grid-template-columns:1fr; } }
.ctrl-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  gap: 12px;
}
.ctrl-row:last-child { border-bottom: none; }
.ctrl-label { font-size: 13px; display: flex; align-items: center; gap: 6px; }
.ctrl-info { font-size: 11px; color: var(--text-3); }
.switch {
  position: relative;
  width: 36px; height: 20px;
  background: var(--bg-surface);
  border-radius: 10px;
  cursor: pointer;
  flex-shrink: 0;
  transition: 0.2s;
}
.switch.on { background: var(--green); }
.switch::after {
  content: "";
  position: absolute;
  top: 2px; left: 2px;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--text-2);
  transition: 0.2s;
}
.switch.on::after { left: 18px; background: #fff; }
.ctrl-input {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 5px 8px;
  color: var(--text);
  font-size: 13px;
  font-family: var(--mono);
  outline: none;
  width: 70px;
}
.ctrl-input:focus { border-color: var(--accent); }
.ctrl-select {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 5px 8px;
  color: var(--text);
  font-size: 13px;
  outline: none;
}
.cfg-textarea {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 8px;
  color: var(--text);
  font-size: 12px;
  font-family: inherit;
  resize: vertical;
  min-height: 50px;
  outline: none;
  margin-bottom: 8px;
}
.cfg-textarea:focus { border-color: var(--accent); }
.cfg-save-bar {
  position: sticky;
  bottom: 0;
  background: var(--bg-card);
  padding: 16px 0;
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  border-top: 1px solid var(--border);
  margin-top: 16px;
}

/* ├── Logs ── */
.log-tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
.log-tbl th {
  text-align: left;
  color: var(--text-3);
  font-weight: 500;
  padding: 6px 8px;
  border-bottom: 1px solid var(--border);
  font-size: 11px;
}
.log-tbl td {
  padding: 6px 8px;
  border-bottom: 1px solid var(--border);
  font-family: var(--mono);
}
.log-tbl tr:hover td { background: var(--bg-surface); }
.log-tbl .time { color: var(--text-3); }
.log-status {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 500;
}
.log-status.studying { background:rgba(42,199,106,0.12); color:var(--green); }
.log-status.looking_down { background:rgba(74,142,245,0.12); color:var(--blue); }
.log-status.look_away { background:rgba(168,85,247,0.12); color:var(--purple); }
.log-status.drowsy { background:rgba(240,90,90,0.15); color:var(--accent); }
.log-status.sleeping { background:rgba(240,90,90,0.1); color:var(--accent); }
.log-status.phone { background:rgba(255,133,64,0.12); color:var(--accent-2); }
.log-status.idle { background:rgba(224,168,0,0.12); color:var(--yellow); }
.log-status.moving { background:rgba(224,168,0,0.1); color:var(--yellow); }
.log-status.away { background:rgba(99,101,110,0.15); color:var(--text-3); }

/* ├── Recordings ── */
.rec-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px,1fr)); gap: 12px; }
.rec-item { background: var(--bg-surface); border-radius: 8px; overflow: hidden; border:1px solid var(--border); }
.rec-item video { width:100%; aspect-ratio:16/9; background:#000; display:block; }
.rec-meta { padding: 8px 12px; font-size: 12px; }
.rec-name { font-family: var(--mono); font-size: 11px; color: var(--text-3); }

/* ├── Toast ── */
.toast {
  position: fixed;
  bottom: 20px; right: 20px;
  padding: 10px 16px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
  z-index: 999;
  animation: slideUp 0.2s;
}
.toast.ok { border-color: var(--green); color: var(--green); }
.toast.err { border-color: var(--accent); color: var(--accent); }
@keyframes slideUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-logo"><div class="nav-logo-dot"></div>Study Monitor</div>
  <div class="nav-tabs">
    <div class="nav-tab active" data-tab="dashboard">📊 实时</div>
    <div class="nav-tab" data-tab="config">⚙️ 配置</div>
    <div class="nav-tab" data-tab="logs">📝 日志</div>
  </div>
  <div class="nav-status">
    <span><span id="dot-monitor" class="dot"></span><span id="txt-monitor">未运行</span></span>
    <span><span id="dot-go2rtc" class="dot"></span>流媒体</span>
  </div>
</nav>

<div class="container">

<!-- ═══ DASHBOARD ═══ -->
<div class="tab-content active" id="tab-dashboard">

  <div class="card">
    <div class="card-title">当前状态 <span class="badge" id="state-time">--</span></div>
    <div class="dash-grid">
      <div class="state-main">
        <div class="state-emoji" id="state-emoji">⏳</div>
        <div class="state-label" id="state-label">加载中</div>
        <div class="state-meta" id="state-meta"></div>
        <div class="state-conf" id="state-conf" style="display:none">置信度 0%</div>
      </div>
      <div class="state-viz">
        <div class="eye-svg-wrap" id="eye-svg">
          <svg width="140" height="60" viewBox="0 0 140 60">
            <!-- left eye -->
            <ellipse cx="42" cy="34" rx="18" ry="12" fill="none" stroke="#63656e" stroke-width="1.5"/>
            <ellipse class="eye-left" cx="42" cy="34" rx="14" ry="10" fill="#1a1b1f"/>
            <ellipse class="pupil-left" cx="42" cy="34" rx="4" ry="4" fill="#e8e9ec"/>
            <!-- right eye -->
            <ellipse cx="98" cy="34" rx="18" ry="12" fill="none" stroke="#63656e" stroke-width="1.5"/>
            <ellipse class="eye-right" cx="98" cy="34" rx="14" ry="10" fill="#1a1b1f"/>
            <ellipse class="pupil-right" cx="98" cy="34" rx="4" ry="4" fill="#e8e9ec"/>
          </svg>
        </div>
        <div class="metrics-grid">
          <div class="metric-item"><span class="metric-label">EAR</span><span class="metric-val" id="m-ear">--</span></div>
          <div class="metric-item"><span class="metric-label">偏转</span><span class="metric-val" id="m-yaw">--</span></div>
          <div class="metric-item"><span class="metric-label">运动</span><span class="metric-val" id="m-move">--</span></div>
          <div class="metric-item"><span class="metric-label">手部</span><span class="metric-val" id="m-hand">--</span></div>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">实时画面 <span class="badge">持续推送</span></div>
    <div class="feed-controls">
      <button class="btn primary" onclick="monitorStart()">▶ 启动</button>
      <button class="btn danger" onclick="monitorStop()">⏹ 停止</button>
      <button class="btn" onclick="ptz('left')">⬅ 左</button>
      <button class="btn" onclick="ptz('right')">➡ 右</button>
      <button class="btn" onclick="ptz('up')">⬆ 上</button>
      <button class="btn" onclick="ptz('down')">⬇ 下</button>
      <button class="btn" onclick="ptz('stop')">⏹</button>
    </div>
    <img class="feed-img" id="snapshot" src="/api/snapshot/auto" alt="摄像头画面">
  </div>

  <div class="card">
    <div class="card-title">待审核告警 <span class="badge" id="alerts-count">0</span></div>
    <div class="alerts-toolbar">
      <select class="ctrl-select" id="alerts-filter" onchange="loadAlerts()">
        <option value="pending">待审核</option>
        <option value="confirmed">已确认</option>
        <option value="dismissed">已忽略</option>
        <option value="all">全部</option>
      </select>
      <span class="hint">💡 告警需确认后才播报语音</span>
    </div>
    <div class="alerts-list" id="alerts-list"></div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
  <div class="card">
    <div class="card-title">专注度 <span class="badge" id="stats-period">1h</span></div>
    <div class="stats-toolbar" style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
      <select class="ctrl-select" id="stats-range" onchange="loadStats()">
        <option value="0.5">30m</option><option value="1" selected>1h</option>
        <option value="3">3h</option><option value="24">今天</option><option value="168">7天</option>
      </select>
      <span class="hint" id="stats-info">--</span>
    </div>
    <div class="stat-big" id="stats-big"></div>
    <div class="stats-bar" id="stats-bar"></div>
  </div>
  <div class="card">
    <div class="card-title">录制视频 <span class="badge" id="rec-count">0</span></div>
    <div class="rec-grid" id="rec-grid"></div>
  </div>
  </div>
</div>

<!-- ═══ CONFIG ═══ -->
<div class="tab-content" id="tab-config">
  <div class="cfg-grid">
    <div>
      <div class="card">
        <div class="card-title">状态检测 <span class="badge">开关</span></div>
        <div id="cfg-states"></div>
      </div>
      <div class="card">
        <div class="card-title">阈值 <span class="badge">数值</span></div>
        <div id="cfg-thresholds"></div>
      </div>
      <div class="card">
        <div class="card-title">告警时长 <span class="badge">秒</span></div>
        <div id="cfg-alerts"></div>
      </div>
    </div>
    <div>
      <div class="card">
        <div class="card-title">语音提醒 <span class="badge">edge-tts</span></div>
        <div class="ctrl-row">
          <span class="ctrl-label">启用</span>
          <div class="switch on" id="cfg-voice-enabled" onclick="this.classList.toggle('on')"></div>
        </div>
        <div class="ctrl-row">
          <span class="ctrl-label">声优</span>
          <select class="ctrl-select" id="cfg-voice-name">
            <option value="zh-CN-XiaoxiaoNeural">晓晓（温柔）</option>
            <option value="zh-CN-YunxiNeural">云希（阳光）</option>
            <option value="zh-CN-YunyangNeural">云扬（专业）</option>
          </select>
        </div>
        <div class="ctrl-row">
          <span class="ctrl-label">冷却（秒）</span>
          <input class="ctrl-input" id="cfg-voice-cooldown" type="number" min="0" value="30" style="width:60px">
        </div>
        <div class="card-title" style="margin-top:12px;">提醒文案</div>
        <div id="cfg-voice-msgs"></div>
      </div>
      <div class="card">
        <div class="card-title">监控源</div>
        <div class="ctrl-row">
          <span class="ctrl-label">RTSP</span>
          <input class="ctrl-input" id="cfg-rtsp" value="rtsp://localhost:8554/xiaomi_camera4" style="flex:1;width:auto">
        </div>
        <div class="ctrl-row">
          <span class="ctrl-label">分析间隔</span>
          <input class="ctrl-input" id="cfg-interval" type="number" min="1" value="2" style="width:60px">
        </div>
      </div>
    </div>
  </div>
  <div class="cfg-save-bar">
    <button class="btn" onclick="loadConfig()">取消</button>
    <button class="btn primary" onclick="saveConfig()">💾 保存</button>
  </div>
</div>

<!-- ═══ LOGS ═══ -->
<div class="tab-content" id="tab-logs">
  <div class="card">
    <div class="card-title">实时日志 <span class="badge" id="log-count">0</span></div>
    <table class="log-tbl">
      <thead><tr>
        <th>时间</th><th>状态</th><th>持续</th><th>EAR</th><th>偏转</th><th>运动</th><th>手部</th><th>置信</th>
      </tr></thead>
      <tbody id="log-body"></tbody>
    </table>
  </div>
</div>

</div><!-- /container -->

<script>
// ─── State ───
const STATE_META = {
  studying:     {emoji:"📚", label:"学习中",       color:"var(--green)"},
  looking_down: {emoji:"👀", label:"看桌面",        color:"var(--blue)"},
  look_away:    {emoji:"🙄", label:"注意力分散",    color:"var(--purple)"},
  drowsy:       {emoji:"😴", label:"打瞌睡/闭眼",  color:"var(--accent)"},
  sleeping:     {emoji:"😪", label:"趴着睡",        color:"var(--accent)"},
  phone:        {emoji:"📱", label:"玩手机",        color:"var(--accent-2)"},
  idle:         {emoji:"😐", label:"发呆",          color:"var(--yellow)"},
  moving:       {emoji:"🪑", label:"动来动去",      color:"var(--yellow)"},
  away:         {emoji:"🚶", label:"离开",          color:"var(--text-3)"},
  init:         {emoji:"⏳", label:"初始化中",      color:"var(--text-3)"},
};
const STATE_COLORS = {
  studying:"#2ac76a", looking_down:"#4a8ef5", look_away:"#a855f7",
  drowsy:"#f05a5a", sleeping:"#d03a3a", phone:"#ff8540",
  idle:"#e0a800", moving:"#c89000", away:"#63656e",
};

let config = {};

function toast(msg,type="ok"){const t=document.createElement("div");t.className=`toast ${type}`;t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2500);}
function switchTab(n){
  document.querySelectorAll(".nav-tab").forEach(t=>t.classList.toggle("active",t.dataset.tab===n));
  document.querySelectorAll(".tab-content").forEach(c=>c.classList.toggle("active",c.id==="tab-"+n));
  if(n==="config")loadConfig();
  if(n==="logs")loadLogs();
  if(n==="dashboard"){loadStatus();refreshSnapshot();}
}
document.addEventListener("DOMContentLoaded",()=>{
  document.querySelectorAll(".nav-tab").forEach(t=>{
    t.addEventListener("click",e=>switchTab(t.dataset.tab));
  });
});
document.querySelectorAll(".nav-tab").forEach(t=>t.addEventListener("click",()=>switchTab(t.dataset.tab)));

function formatDuration(s){if(s<60)return s+"s";const m=Math.floor(s/60),sec=s%60;return m+"m"+sec+"s";}

// ─── Status ───
async function loadStatus(){
  const s=await api("/api/status");
  const dot=$("dot-monitor"),txt=$("txt-monitor");
  if(s.running){dot.className="dot on";txt.textContent="运行中";}
  else{dot.className="dot off";txt.textContent="未运行";}

  const st=s.current_state;
  if(!st||!st.status){$("state-emoji").textContent="⏳";$("state-label").textContent="暂无数据";$("state-meta").textContent="等待监控...";return;}
  const meta=STATE_META[st.status]||STATE_META.init;
  $("state-emoji").textContent=meta.emoji;
  $("state-label").textContent=meta.label;
  $("state-meta").textContent=`持续 ${formatDuration(st.duration_seconds)} · ${st.timestamp}`;
  $("state-conf").textContent=`置信度 ${Math.round(st.confidence*100)}%`;$("state-conf").style.display="";
  $("state-time").textContent=st.timestamp;

  // metrics
  $("m-ear").textContent=st.eye_ear?.toFixed(3)||"--";$("m-ear").className="metric-val"+(st.eyes_closed?" danger":"");
  $("m-yaw").textContent=(st.head_yaw>=0?"+":"")+(st.head_yaw?.toFixed(3)||"--");$("m-yaw").className="metric-val"+(Math.abs(st.head_yaw||0)>0.1?" warn":"");
  $("m-move").textContent=st.movement_level?.toFixed(4)||"--";$("m-move").className="metric-val"+(st.movement_level>0.08?" warn":"");
  $("m-hand").textContent=st.hand_movement?.toFixed(3)||"--";

  // eye SVG update
  updateEyes(st.eye_ear||0.30,st.eyes_closed);
}

function updateEyes(ear,closed){
  const el=document.querySelector(".eye-left"),er=document.querySelector(".eye-right"),
        pl=document.querySelector(".pupil-left"),pr=document.querySelector(".pupil-right");
  const ratio=Math.min(1,Math.max(0.05,ear/0.35));
  const ry=ratio*10;
  if(el){el.setAttribute("ry",ry);er&&er.setAttribute("ry",ry);}
  if(closed){el&&el.setAttribute("fill","#2a2b30");er&&er.setAttribute("fill","#2a2b30");pl&&(pl.style.display="none");pr&&(pr.style.display="none");}
  else{el&&el.setAttribute("fill","#1a1b1f");er&&er.setAttribute("fill","#1a1b1f");pl&&(pl.style.display="");pr&&(pr.style.display="");}
}

// ─── Monitor Control ───
async function monitorStart(){const r=await api("/api/start",{method:"POST"});toast(r.ok?"已启动":r.message,r.ok?"ok":"err");loadStatus();}
async function monitorStop(){const r=await api("/api/stop",{method:"POST"});toast(r.ok?"已停止":r.message,r.ok?"ok":"err");loadStatus();}
async function ptz(d){const r=await api("/api/camera/ptz",{method:"POST",body:JSON.stringify({direction:d,angle:5})});toast(r.ok?"✓":r.message,r.ok?"ok":"err");}

// ─── Alerts ───
async function loadAlerts(){
  const filter=$("alerts-filter").value;
  const alerts=await api("/api/alerts?status="+filter+"&limit=20");
  $("alerts-list").innerHTML=alerts.length===0?'<span class="hint" style="padding:16px;text-align:center">暂无</span>'
    : alerts.map(a=>{
    const meta=STATE_META[a.status]||{emoji:"🔔",label:a.status};
    const ss=a.study_state||{};
    const btns=a.status_==="pending"
      ?`<button class="alert-btn confirm" onclick="confirmAlert('${a.id}')">✅ 确认</button>`+
       `<button class="alert-btn dismiss" onclick="dismissAlert('${a.id}')">❌ 忽略</button>`
      :'<span class="hint">'+(a.status_==="confirmed"?"已播报":"已忽略")+'</span>';
    return`<div class="alert-item ${a.status_}">
      <div class="alert-head"><div class="alert-type">${meta.emoji} ${meta.label}</div><div class="alert-time">${a.timestamp}</div></div>
      <div class="alert-msg">💬 ${a.alert_msg}</div>
      <div class="alert-detail">
        <div class="alert-det"><div class="lbl">持续</div><div class="val">${a.duration_seconds}s</div></div>
        <div class="alert-det"><div class="lbl">EAR</div><div class="val">${(ss.eye_ear||0).toFixed(3)}</div></div>
        <div class="alert-det"><div class="lbl">偏转</div><div class="val">${(ss.head_yaw>=0?"+":"")+(ss.head_yaw||0).toFixed(3)}</div></div>
        <div class="alert-det"><div class="lbl">手部</div><div class="val">${(ss.hand_movement||0).toFixed(3)}</div></div>
        <div class="alert-det"><div class="lbl">置信</div><div class="val">${Math.round((ss.confidence||0)*100)}%</div></div>
      </div>
      <div class="alert-actions">${btns}</div>
    </div>`;
  }).join("");
  const all=await api("/api/alerts?status=pending&limit=100");
  $("alerts-count").textContent=all.length;
}
async function confirmAlert(id){const r=await api("/api/alerts/"+id+"/confirm",{method:"POST"});toast(r.ok?"已播报":"失败",r.ok?"ok":"err");loadAlerts();}
async function dismissAlert(id){const r=await api("/api/alerts/"+id+"/dismiss",{method:"POST"});toast(r.ok?"已忽略":"失败",r.ok?"ok":"err");loadAlerts();}

// ─── Stats ───
async function loadStats(){
  const h=parseFloat($("stats-range").value);
  const r=await api("/api/stats?hours="+h);
  if(!r.total_entries){$("stats-big").innerHTML='<div class="stat-big-item"><div class="val">--</div><div class="lbl">暂无数据</div></div>';return;}
  $("stats-info").textContent=r.time_range.from.split(" ")[1]+" ~ "+r.time_range.to.split(" ")[1]+" · "+r.total_entries+"条";
  $("stats-big").innerHTML=
    `<div class="stat-big-item" style="grid-column:span 3"><div class="val" style="color:var(--green);font-size:32px">${r.focus_score}%</div><div class="lbl">专注度（学习占比）</div></div>`+
    `<div class="stat-big-item"><div class="val">${r.transitions}</div><div class="lbl">切换次数</div></div>`+
    `<div class="stat-big-item"><div class="val">${Math.round(r.total_duration_sec/60)}m</div><div class="lbl">监测时长</div></div>`;
  const dur=Object.entries(r.by_status).sort((a,b)=>b[1].duration_sec-a[1].duration_sec);
  const max=Math.max(...dur.map(([,v])=>v.duration_sec),1);
  $("stats-bar").innerHTML=dur.map(([k,v])=>{
    const m=STATE_META[k]||{emoji:"•"};const p=(v.duration_sec/max*100).toFixed(0);
    const min=Math.floor(v.duration_sec/60),sec=v.duration_sec%60;
    return`<div class="stat-row">
      <div class="stat-label">${m.emoji} ${k}</div>
      <div class="stat-track"><div class="stat-fill" style="width:${p}%;background:${STATE_COLORS[k]||"var(--text-3)"}"></div></div>
      <div class="stat-time">${min>0?min+"m"+sec+"s":sec+"s"}</div>
    </div>`;
  }).join("");
}

// ─── Config ───
async function loadConfig(){
  config=await api("/api/config");
  // states
  const st=config.detection.enabled_states;
  $("cfg-states").innerHTML=Object.entries(STATE_META).filter(([k])=>k!=="init").map(([k,m])=>
    `<div class="ctrl-row"><span class="ctrl-label">${m.emoji} ${m.label}</span><div class="switch ${st[k]?"on":""}" onclick="togState('${k}')"></div></div>`
  ).join("");
  // thresholds
  $("cfg-thresholds").innerHTML=Object.entries({
    HEAD_DOWN_THRESHOLD:{label:"低头阈值",hint:"越大越不易判趴着",v:config.thresholds.HEAD_DOWN_THRESHOLD||0.65,step:0.05},
    BODY_GONE_THRESHOLD:{label:"离开阈值",hint:"越小越不易判离开",v:config.thresholds.BODY_GONE_THRESHOLD||0.15,step:0.05},
    HAND_BELOW_DESK:{label:"手在桌下阈值",hint:"",v:config.thresholds.HAND_BELOW_DESK||0.75,step:0.05},
    MOVEMENT_THRESHOLD:{label:"运动阈值",hint:"",v:config.thresholds.MOVEMENT_THRESHOLD||0.08,step:0.01},
    HEAD_YAW_THRESHOLD:{label:"转头阈值",hint:"",v:config.thresholds.HEAD_YAW_THRESHOLD||0.10,step:0.01},
    EYE_CLOSED_THRESHOLD:{label:"闭眼阈值",hint:"越小越敏感",v:config.thresholds.EYE_CLOSED_THRESHOLD||0.15,step:0.01},
  }).map(([key,t])=>
    `<div class="ctrl-row"><span class="ctrl-label">${t.label} <span class="ctrl-info">${t.hint}</span></span><input class="ctrl-input" type="number" data-kt="${key}" value="${t.v.toFixed(t.step>=0.05?2:2)}" step="${t.step}" min="0" max="1"></div>`
  ).join("");
  // alerts
  $("cfg-alerts").innerHTML=Object.entries({
    DROWSY_ALERT_AFTER:{label:"打瞌睡",hint:"闭眼持续",v:config.alert_seconds.DROWSY_ALERT_AFTER||5},
    LOOK_AWAY_ALERT_AFTER:{label:"看别处",hint:"",v:config.alert_seconds.LOOK_AWAY_ALERT_AFTER||10},
    SLEEP_ALERT_AFTER:{label:"趴睡",hint:"",v:config.alert_seconds.SLEEP_ALERT_AFTER||30},
    PHONE_ALERT_AFTER:{label:"玩手机",v:config.alert_seconds.PHONE_ALERT_AFTER||20},
    IDLE_ALERT_AFTER:{label:"发呆",v:config.alert_seconds.IDLE_ALERT_AFTER||60},
    AWAY_ALERT_AFTER:{label:"离开",v:config.alert_seconds.AWAY_ALERT_AFTER||30},
    MOVING_ALERT_AFTER:{label:"动来动去",v:config.alert_seconds.MOVING_ALERT_AFTER||120},
  }).map(([key,t])=>
    `<div class="ctrl-row"><span class="ctrl-label">${t.label}</span><input class="ctrl-input" type="number" data-ak="${key}" value="${t.v}" min="0" step="1" style="width:50px">秒</div>`
  ).join("");
  // voice
  $("cfg-voice-enabled").className="switch"+(config.voice.enabled?" on":"");
  $("cfg-voice-name").value=config.voice.name;
  $("cfg-voice-cooldown").value=config.voice.cooldown;
  $("cfg-voice-msgs").innerHTML=Object.entries(config.voice.messages).map(([k,v])=>{
    const m=STATE_META[k]||{emoji:"🔔",label:k};
    return`<div class="ctrl-row"><span class="ctrl-label">${m.emoji} ${m.label}</span></div><textarea class="cfg-textarea" data-vk="${k}">${v}</textarea>`;
  }).join("");
  $("cfg-rtsp").value=config.monitor.rtsp;
  $("cfg-interval").value=config.monitor.check_interval;
}

function togState(k){const el=document.querySelector(`[onclick="togState('${k}')"]`);if(!el)return;const on=el.classList.toggle("on");if(config.detection)config.detection.enabled_states[k]=on;}

async function saveConfig(){
  // collect from DOM
  document.querySelectorAll("[data-kt]").forEach(el=>{if(config.thresholds)config.thresholds[el.dataset.kt]=parseFloat(el.value);});
  document.querySelectorAll("[data-ak]").forEach(el=>{if(config.alert_seconds)config.alert_seconds[el.dataset.ak]=parseInt(el.value);});
  if(config.voice){
    config.voice.enabled=$("cfg-voice-enabled").classList.contains("on");
    config.voice.name=$("cfg-voice-name").value;
    config.voice.cooldown=parseInt($("cfg-voice-cooldown").value);
    document.querySelectorAll("[data-vk]").forEach(el=>{config.voice.messages[el.dataset.vk]=el.value;});
  }
  config.monitor.rtsp=$("cfg-rtsp").value;
  config.monitor.check_interval=parseInt($("cfg-interval").value);
  const r=await api("/api/config",{method:"POST",body:JSON.stringify(config)});
  toast(r.ok?"已保存（重启后生效）":"失败",r.ok?"ok":"err");
}

// ─── Logs ───
async function loadLogs(){
  const r=await api("/api/logs?limit=50");
  $("log-count").textContent=r.length+"条";
  $("log-body").innerHTML=r.map(e=>{
    const dt=e.timestamp;
    return`<tr>
      <td class="time">${dt.split(" ")[1]||dt}</td>
      <td><span class="log-status ${e.status}">${STATE_META[e.status]?.emoji||"•"} ${e.status}</span></td>
      <td>${formatDuration(e.duration_seconds)}</td>
      <td>${e.eye_ear?.toFixed(3)||"--"}</td>
      <td>${(e.head_yaw>=0?"+":"")+(e.head_yaw?.toFixed(3)||"--")}</td>
      <td>${e.movement_level?.toFixed(4)||"--"}</td>
      <td>${e.hand_movement?.toFixed(3)||"--"}</td>
      <td>${Math.round((e.confidence||0)*100)}%</td>
    </tr>`;
  }).join("");
}

// ─── Recordings ───
async function loadRecordings(){
  const r=await api("/api/recordings");
  $("rec-count").textContent=r.length;
  $("rec-grid").innerHTML=r.length===0?'<span class="hint" style="padding:16px;text-align:center">暂无</span>'
    :r.map(f=>`<div class="rec-item"><video controls preload="metadata" src="${f.url}"></video><div class="rec-meta"><div class="rec-name">${f.filename}</div><div>${f.size_mb}MB</div></div></div>`).join("");
}

// ─── Go2rtc ───
async function checkGo2rtc(){
  try{const r=await api("/api/go2rtc/status");$("dot-go2rtc").className="dot "+(r.running?"on":"off");}catch(e){$("dot-go2rtc").className="dot off";}
}

// ─── Refresh ───
async function refreshAll(){
  await Promise.all([loadStatus(),loadLogs(),loadStats(),checkGo2rtc(),loadAlerts(),loadRecordings()]);
}
setInterval(refreshAll,3000);

// Init
(async function init(){await loadConfig();refreshAll();})();
</script>
</body>
</html>
